<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1116">
<title>翻頁相簿 · 專案設定</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #16191f;
    --panel-2: #1e222a;
    --panel-3: #262b35;
    --line: rgba(255,255,255,.06);
    --line-strong: rgba(255,255,255,.1);
    --text: #e9ecf3;
    --text-2: #b7bdcb;
    --muted: #737b8c;
    --muted-2: #4f5666;
    --accent: #5b8cff;
    --accent-soft: rgba(91,140,255,.15);
    --danger: #ff5c6c;
    --ok: #4ade80;
    --radius: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 14px;
    overscroll-behavior: none;
  }
  body { overflow: hidden; }

  .view {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  .view[hidden] { display: none; }

  /* ============================================================
     頂部欄
     ============================================================ */
  .topbar {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
    min-height: 56px;
    background: rgba(11, 13, 18, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .topbar h1 {
    margin: 0; flex: 1; min-width: 0;
    font-size: 16px; font-weight: 600;
    letter-spacing: .01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .btn-back {
    flex: none;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 10px 7px 6px;
    border-radius: 8px;
    background: none; border: none;
    color: var(--text-2);
    font-size: 13px; font-family: inherit;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .btn-back:hover { background: var(--panel-2); color: var(--text); }
  .btn-back:active { background: var(--panel-3); }
  .btn-back svg { display: block; }

  .btn-view {
    flex: none;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 14px;
    border-radius: 9px;
    background: var(--accent-soft);
    border: 1px solid rgba(91,140,255,.28);
    color: #a8c0ff;
    font-size: 13px; font-weight: 500; font-family: inherit;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-view:hover { background: rgba(91,140,255,.22); }
  .btn-view:active { background: rgba(91,140,255,.32); }
  .btn-view svg { display: block; }

  .sync-badge {
    flex: none;
    font-size: 11.5px;
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    transition: color .2s, background .2s;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .sync-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted-2);
    transition: background .2s;
  }
  .sync-badge.ok { color: var(--ok); }
  .sync-badge.ok::before { background: var(--ok); box-shadow: 0 0 6px rgba(74,222,128,.6); }
  .sync-badge.err { color: var(--danger); }
  .sync-badge.err::before { background: var(--danger); }

  /* ============================================================
     內容捲動區（頁面清單 / 專案清單）
     ============================================================ */
  .scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 16px 20px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    align-content: start;
  }

  @media (min-width: 720px) {
    .scroll {
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 12px;
      padding: 16px 20px 24px;
    }
  }

  @media (min-width: 1280px) {
    .scroll {
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    }
  }

  /* ============================================================
     底部按鈕列
     ============================================================ */
  .bottombar {
    flex: none;
    display: flex; gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, rgba(11,13,18,0));
    border-top: 1px solid var(--line);
  }

  .btn {
    flex: 1;
    border: none; border-radius: var(--radius);
    padding: 15px 16px;
    font-size: 15px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform .08s, filter .15s, background .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary {
    background: var(--accent); color: #fff;
    box-shadow: 0 6px 20px -6px rgba(91,140,255,.7);
  }
  .btn.primary:hover { background: #6b97ff; }

  /* ============================================================
     專案清單卡片
     ============================================================ */
  .proj-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .08s;
  }
  .proj-card:hover {
    border-color: var(--line-strong);
    background: #1a1e25;
  }
  .proj-card:active { transform: scale(.995); }

  .proj-head {
    display: flex; align-items: flex-start; gap: 12px;
  }
  .proj-icon {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    color: #a8c0ff;
  }
  .proj-info { flex: 1; min-width: 0; }
  .proj-name {
    font-size: 15.5px; font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .proj-meta {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .proj-actions {
    display: flex; gap: 8px;
  }
  .mini-btn {
    flex: 1;
    padding: 9px 8px;
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-2);
    font-size: 12.5px; font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  .mini-btn:hover { background: var(--panel-3); color: var(--text); }
  .mini-btn:active { transform: scale(.98); }
  .mini-btn.accent { color: #a8c0ff; border-color: rgba(91,140,255,.25); }
  .mini-btn.accent:hover { background: var(--accent-soft); }
  .mini-btn.danger:hover { color: var(--danger); border-color: rgba(255,92,108,.3); background: rgba(255,92,108,.08); }

  /* ============================================================
     頁面卡片（編輯器內）
     ============================================================ */
  .item {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    gap: 12px;
    align-items: stretch;
    transition: border-color .15s;
  }
  .item:hover { border-color: var(--line-strong); }

  /* --- 縮圖 --- */
  .thumb {
    position: relative;
    width: 68px; flex: none;
    border-radius: 10px;
    background: #0a0c11;
    border: 1px solid var(--line);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg, rgba(91,140,255,.06), transparent 60%),
      radial-gradient(circle at 30% 30%, rgba(255,255,255,.04), transparent 70%);
    pointer-events: none;
  }
  .thumb img {
    position: relative;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    z-index: 1;
  }
  .thumb .placeholder {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted-2);
    z-index: 0;
  }
  .thumb .placeholder svg { width: 22px; height: 22px; }
  .badge {
    position: absolute;
    left: 5px; top: 5px;
    padding: 3px 6px;
    border-radius: 5px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    z-index: 2;
  }

  /* --- 內容區 --- */
  .content {
    flex: 1;
    min-width: 0;
    display: flex; flex-direction: column;
    gap: 8px;
    justify-content: space-between;
  }

  .src {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .src:hover { background: #232833; }
  .src:focus {
    border-color: rgba(91,140,255,.5);
    background: #232833;
  }
  .src::placeholder { color: var(--muted-2); }

  .row-actions {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .filebtn {
    flex: 1; min-width: 0;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-2);
    font-size: 12.5px; font-weight: 500;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    transition: background .15s, color .15s;
  }
  .filebtn:hover { background: var(--panel-3); color: var(--text); }
  .filebtn:active { background: #2c313d; }
  .filebtn svg { flex: none; }

  .iconbtn {
    width: 34px; height: 34px;
    flex: none;
    padding: 0;
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .iconbtn:hover:not(:disabled) { background: var(--panel-3); color: var(--text); }
  .iconbtn:active:not(:disabled) { transform: scale(.94); }
  .iconbtn:disabled { opacity: .25; cursor: default; }
  .iconbtn.danger:hover:not(:disabled) { color: var(--danger); border-color: rgba(255,92,108,.3); }
  .iconbtn svg { display: block; }

  /* ============================================================
     空狀態
     ============================================================ */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 30px;
    color: var(--muted);
  }
  .empty .em-icon {
    display: inline-flex;
    width: 60px; height: 60px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    align-items: center; justify-content: center;
    margin-bottom: 16px;
    color: var(--muted);
  }
  .empty .em-icon svg { width: 28px; height: 28px; }
  .empty p { margin: 6px 0; font-size: 14px; line-height: 1.7; }
  .empty .hint { font-size: 12.5px; color: var(--muted-2); margin-top: 10px; }

  /* ============================================================
     載入中
     ============================================================ */
  #loading {
    position: fixed; inset: 0;
    z-index: 300;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    color: var(--muted); font-size: 14px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.08);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading.hidden { display: none; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>正在連線…</div>
</div>

<!-- ============ 專案列表 ============ -->
<section id="projectListView" class="view">
  <header class="topbar">
    <h1>我的專案</h1>
    <span id="syncStatus" class="sync-badge"></span>
  </header>
  <main id="projectListEl" class="scroll"></main>
  <footer class="bottombar">
    <button id="btnNewProject" class="btn primary">＋ 新增專案</button>
  </footer>
</section>

<!-- ============ 編輯器 ============ -->
<section id="editorView" class="view" hidden>
  <header class="topbar">
    <button id="btnBack" class="btn-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      返回
    </button>
    <h1 id="editorTitle">專案</h1>
    <button id="btnViewProject" class="btn-view">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      檢視
    </button>
  </header>
  <main id="pageListEl" class="scroll"></main>
  <footer class="bottombar">
    <button id="btnAddPage" class="btn primary">＋ 新增頁面</button>
  </footer>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, set, get, onValue, remove
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOdduuzIRGsF03F41fNSeyMWbav0fxFD8",
  authDomain: "travelbook-a90ed.firebaseapp.com",
  databaseURL: "https://travelbook-a90ed-default-rtdb.firebaseio.com",
  projectId: "travelbook-a90ed",
  storageBucket: "travelbook-a90ed.firebasestorage.app",
  messagingSenderId: "318594004244",
  appId: "1:318594004244:web:749b0385b64a103fe07e01"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ---------- 元素 ---------- */
const loadingEl     = document.getElementById('loading');
const syncEl        = document.getElementById('syncStatus');
const projectView   = document.getElementById('projectListView');
const editorView    = document.getElementById('editorView');
const projectListEl = document.getElementById('projectListEl');
const pageListEl    = document.getElementById('pageListEl');
const editorTitle   = document.getElementById('editorTitle');
const btnNewProject = document.getElementById('btnNewProject');
const btnBack       = document.getElementById('btnBack');
const btnViewProj   = document.getElementById('btnViewProject');
const btnAddPage    = document.getElementById('btnAddPage');

/* ---------- 圖示 ---------- */
const SVG_IMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
  '<rect x="3" y="3" width="18" height="18" rx="2"/>' +
  '<circle cx="8.5" cy="8.5" r="1.5"/>' +
  '<polyline points="21 15 16 10 5 21"/></svg>';

const SVG_FOLDER = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';

const SVG_UP = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
  '<polyline points="18 15 12 9 6 15"/></svg>';

const SVG_DOWN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
  '<polyline points="6 9 12 15 18 9"/></svg>';

const SVG_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
  '<line x1="18" y1="6" x2="6" y2="18"/>' +
  '<line x1="6" y1="6" x2="18" y2="18"/></svg>';

/* ---------- 狀態 ---------- */
let projectsMap = {};
let currentId   = null;
let currentProj = null;
let saveTimer   = null;
let cloudReady  = false;

/* ---------- 工具 ---------- */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function pageKeySort(a, b) {
  const na = parseInt(String(a).replace(/\D/g, ''), 10) || 0;
  const nb = parseInt(String(b).replace(/\D/g, ''), 10) || 0;
  return na - nb;
}

function setSync(text, cls) {
  syncEl.textContent = text || '';
  syncEl.className = 'sync-badge' + (cls ? ' ' + cls : '');
}

function timeAgo(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const s = Math.floor(diff / 1000);
  if (s < 60) return '剛剛';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' 分鐘前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小時前';
  const d = Math.floor(h / 24);
  if (d < 30) return d + ' 天前';
  const dt = new Date(ts);
  return dt.getFullYear() + '/' + (dt.getMonth() + 1) + '/' + dt.getDate();
}

/* ============================================================
   專案列表
   ============================================================ */
function renderProjectList() {
  projectListEl.innerHTML = '';

  const list = Object.keys(projectsMap).map(function (id) {
    const d = projectsMap[id] || {};
    return {
      id: id,
      name: d.name || '未命名專案',
      pageCount: d.pages ? Object.keys(d.pages).length : 0,
      updatedAt: d.updatedAt || 0
    };
  }).sort(function (a, b) { return b.updatedAt - a.updatedAt; });

  if (list.length === 0) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML =
      '<div class="em-icon">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>' +
        '<path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>' +
      '</div>' +
      '<p>還沒有任何專案</p>' +
      '<p class="hint">點下面的「＋ 新增專案」開始建立</p>';
    projectListEl.appendChild(e);
    return;
  }

  list.forEach(function (p) {
    const card = document.createElement('div');
    card.className = 'proj-card';

    const head = document.createElement('div');
    head.className = 'proj-head';

    const icon = document.createElement('div');
    icon.className = 'proj-icon';
    icon.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>' +
      '<path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';

    const info = document.createElement('div');
    info.className = 'proj-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'proj-name';
    nameEl.textContent = p.name;

    const metaEl = document.createElement('div');
    metaEl.className = 'proj-meta';
    metaEl.textContent = p.pageCount + ' 頁' + (p.updatedAt ? ' · ' + timeAgo(p.updatedAt) : '');

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    head.appendChild(icon);
    head.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'proj-actions';

    const bView = document.createElement('button');
    bView.className = 'mini-btn accent';
    bView.innerHTML =
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>' +
      '<circle cx="12" cy="12" r="3"/></svg> 檢視';
    bView.addEventListener('click', function (e) {
      e.stopPropagation();
      openViewer(p.id);
    });

    const bShare = document.createElement('button');
    bShare.className = 'mini-btn';
    bShare.innerHTML =
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>' +
      '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> 複製連結';
    bShare.addEventListener('click', function (e) {
      e.stopPropagation();
      copyShareLink(p.id);
    });

    const bDel = document.createElement('button');
    bDel.className = 'mini-btn danger';
    bDel.innerHTML =
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<polyline points="3 6 5 6 21 6"/>' +
      '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>' +
      '<path d="M10 11v6M14 11v6"/></svg> 刪除';
    bDel.addEventListener('click', function (e) {
      e.stopPropagation();
      deleteProject(p.id, p.name);
    });

    actions.appendChild(bView);
    actions.appendChild(bShare);
    actions.appendChild(bDel);

    card.appendChild(head);
    card.appendChild(actions);

    card.addEventListener('click', function () {
      openEditor(p.id);
    });

    projectListEl.appendChild(card);
  });
}

/* ============================================================
   專案操作
   ============================================================ */
btnNewProject.addEventListener('click', async function () {
  const name = prompt('請輸入專案名稱', '我的相簿');
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;

  const id = uid();
  setSync('建立中…', '');

  try {
    await set(ref(db, 'projects/' + id), {
      name: trimmed,
      updatedAt: Date.now()
    });
    setSync('已建立', 'ok');
    setTimeout(function () {
      if (syncEl.textContent === '已建立') setSync('');
    }, 1500);
    openEditor(id);
  } catch (err) {
    console.error(err);
    setSync('建立失敗', 'err');
    alert('建立失敗：' + err.message);
  }
});

async function deleteProject(id, name) {
  if (!confirm('確定要刪除專案「' + name + '」嗎？\n所有頁面都會一起被刪除。')) return;

  try {
    await remove(ref(db, 'projects/' + id));
    setSync('已刪除', 'ok');
    setTimeout(function () {
      if (syncEl.textContent === '已刪除') setSync('');
    }, 1500);
  } catch (err) {
    alert('刪除失敗：' + err.message);
  }
}

function openViewer(id) {
  const url = new URL('view.html', location.href);
  url.searchParams.set('project', id);
  window.open(url.toString(), '_blank');
}

async function copyShareLink(id) {
  const url = new URL('view.html', location.href);
  url.searchParams.set('project', id);
  const link = url.toString();

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(link);
      setSync('連結已複製', 'ok');
      setTimeout(function () {
        if (syncEl.textContent === '連結已複製') setSync('');
      }, 1800);
    } else {
      prompt('複製以下連結：', link);
    }
  } catch (e) {
    prompt('複製以下連結：', link);
  }
}

/* ============================================================
   檢視切換
   ============================================================ */
function showView(which) {
  if (which === 'editor') {
    projectView.hidden = true;
    editorView.hidden = false;
  } else {
    editorView.hidden = true;
    projectView.hidden = false;
  }
}

async function openEditor(id) {
  setSync('載入中…', '');

  try {
    const snap = await get(ref(db, 'projects/' + id));
    const data = snap.val();

    if (!data) {
      setSync('專案不存在', 'err');
      alert('找不到這個專案');
      return;
    }

    currentId = id;

    const pages = [];
    if (data.pages && typeof data.pages === 'object') {
      Object.keys(data.pages).sort(pageKeySort).forEach(function (k) {
        const p = data.pages[k];
        if (p && typeof p === 'object') {
          pages.push({
            id: p.id || uid(),
            src: p.src || '',
            name: p.name || ''
          });
        }
      });
    }

    currentProj = {
      name: data.name || '未命名專案',
      pages: pages
    };

    editorTitle.textContent = currentProj.name;
    renderEditor();
    showView('editor');
    setSync('已載入', 'ok');
    setTimeout(function () {
      if (syncEl.textContent === '已載入') setSync('');
    }, 1200);
  } catch (err) {
    console.error(err);
    setSync('載入失敗', 'err');
    alert('載入失敗：' + err.message);
  }
}

btnBack.addEventListener('click', function () {
  if (currentProj && currentProj.pages.length > 0) {
    clearTimeout(saveTimer);
    saveProject();
  }
  currentId = null;
  currentProj = null;
  showView('list');
});

btnViewProj.addEventListener('click', function () {
  if (!currentId) return;
  openViewer(currentId);
});

/* ---------- 儲存 ---------- */
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProject, 500);
}

function saveProject() {
  if (!currentId || !currentProj) return;

  setSync('儲存中…', '');

  const pagesObj = {};
  currentProj.pages.forEach(function (p, i) {
    pagesObj['p' + i] = {
      id: p.id,
      src: p.src,
      name: p.name
    };
  });

  const payload = {
    name: currentProj.name,
    updatedAt: Date.now()
  };

  if (Object.keys(pagesObj).length > 0) {
    payload.pages = pagesObj;
  }

  set(ref(db, 'projects/' + currentId), payload)
    .then(function () {
      setSync('已同步', 'ok');
      setTimeout(function () {
        if (syncEl.textContent === '已同步') setSync('');
      }, 1800);
    })
    .catch(function (err) {
      console.error(err);
      setSync('儲存失敗', 'err');
    });
}

/* ---------- 圖片壓縮 ---------- */
function compressImage(file, maxDim, quality) {
  maxDim  = maxDim  || 1600;
  quality = quality || 0.82;

  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onerror = function () { reject(new Error('讀取失敗')); };
    reader.onload = function () {
      const img = new Image();
      img.onerror = function () { reject(new Error('解碼失敗')); };
      img.onload = function () {
        try {
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));

          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (e) { reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   編輯器渲染
   ============================================================ */
function fillThumb(wrap, src) {
  const old = wrap.querySelector('img');
  if (old) old.remove();

  if (!src) return;

  const img = document.createElement('img');
  img.alt = '';
  img.src = src;
  img.addEventListener('error', function () { img.remove(); });
  wrap.insertBefore(img, wrap.firstChild);
}

function makeIconBtn(svg, disabled, onClick, cls, title) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'iconbtn' + (cls ? ' ' + cls : '');
  b.innerHTML = svg;
  b.disabled = !!disabled;
  if (title) b.title = title;
  b.addEventListener('click', onClick);
  return b;
}

function renderEditor() {
  pageListEl.innerHTML = '';

  if (!currentProj || currentProj.pages.length === 0) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML =
      '<div class="em-icon">' + SVG_IMG + '</div>' +
      '<p>這個專案還沒有頁面</p>' +
      '<p class="hint">點下面的「＋ 新增頁面」開始</p>';
    pageListEl.appendChild(e);
    return;
  }

  currentProj.pages.forEach(function (p, i) {
    pageListEl.appendChild(buildPageItem(p, i));
  });
}

function buildPageItem(p, i) {
  const item = document.createElement('div');
  item.className = 'item';

  /* --- 縮圖 --- */
  const thumb = document.createElement('div');
  thumb.className = 'thumb';

  const placeholder = document.createElement('div');
  placeholder.className = 'placeholder';
  placeholder.innerHTML = SVG_IMG;
  thumb.appendChild(placeholder);

  fillThumb(thumb, p.src);

  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = String(i + 1);
  thumb.appendChild(badge);

  /* --- 內容 --- */
  const content = document.createElement('div');
  content.className = 'content';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'src';
  input.inputMode = 'url';
  input.autocapitalize = 'off';
  input.autocorrect = 'off';
  input.spellcheck = false;

  if (p.name) {
    input.placeholder = '本機：' + p.name;
    input.value = '';
  } else {
    input.placeholder = '圖片網址 https://…';
    input.value = p.src || '';
  }

  input.addEventListener('input', function () {
    p.src  = input.value.trim();
    p.name = '';
    input.placeholder = '圖片網址 https://…';
    fillThumb(thumb, p.src);
    scheduleSave();
  });

  const row = document.createElement('div');
  row.className = 'row-actions';

  const fileLabel = document.createElement('label');
  fileLabel.className = 'filebtn';
  fileLabel.innerHTML = SVG_FOLDER + '<span>本機圖片</span>';

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.style.display = 'none';
  fileLabel.appendChild(fileInput);

  fileInput.addEventListener('change', function () {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;

    const textSpan = fileLabel.querySelector('span');
    textSpan.textContent = '處理中…';

    compressImage(f).then(function (dataUrl) {
      p.src  = dataUrl;
      p.name = f.name;
      input.value = '';
      input.placeholder = '本機：' + f.name;
      fillThumb(thumb, p.src);
      scheduleSave();
      textSpan.textContent = '本機圖片';
    }).catch(function () {
      alert('讀取圖片失敗，請換一張試試。');
      textSpan.textContent = '本機圖片';
    });
  });

  row.appendChild(fileLabel);
  row.appendChild(makeIconBtn(SVG_UP, i === 0,
    function () { movePage(i, -1); }, '', '上移'));
  row.appendChild(makeIconBtn(SVG_DOWN, i === currentProj.pages.length - 1,
    function () { movePage(i, 1); }, '', '下移'));
  row.appendChild(makeIconBtn(SVG_X, false,
    function () { deletePage(i); }, 'danger', '刪除'));

  content.appendChild(input);
  content.appendChild(row);

  item.appendChild(thumb);
  item.appendChild(content);

  return item;
}

function movePage(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= currentProj.pages.length) return;
  const tmp = currentProj.pages[i];
  currentProj.pages[i] = currentProj.pages[j];
  currentProj.pages[j] = tmp;
  scheduleSave();
  renderEditor();
}

function deletePage(i) {
  if (!confirm('確定要刪除第 ' + (i + 1) + ' 頁嗎？')) return;
  currentProj.pages.splice(i, 1);
  scheduleSave();
  renderEditor();
}

btnAddPage.addEventListener('click', function () {
  if (!currentProj) return;
  currentProj.pages.push({ id: uid(), src: '', name: '' });
  scheduleSave();
  renderEditor();

  requestAnimationFrame(function () {
    const items = pageListEl.querySelectorAll('.item');
    const last  = items[items.length - 1];
    if (!last) return;
    last.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const inp = last.querySelector('.src');
    if (inp) setTimeout(function () { inp.focus(); }, 320);
  });
});

onValue(projectsRef, function (snapshot) {

    setSync('已連線', 'ok');
    setTimeout(function () {
      if (syncEl.textContent === '已連線') setSync('');
    }, 1800);
  }

  renderProjectList();
}, function (err) {
  console.error('讀取失敗：', err);
  loadingEl.classList.add('hidden');
  setSync('連線失敗', 'err');
});
